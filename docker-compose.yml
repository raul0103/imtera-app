services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imtera-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    networks:
      - imtera
    depends_on:
      - mysql
    entrypoint: sh -c "chown -R www-data:www-data /var/www/html/storage /var/www/html/bootstrap/cache && php-fpm"

  mysql:
    image: mysql/mysql-server:8.0
    container_name: imtera-mysql
    restart: unless-stopped
    # env_file:
    #   - ./backend/.env
    environment:
      # MYSQL_ROOT_PASSWORD: "${DB_PASSWORD}"
      # MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: "${DB_DATABASE}"
      MYSQL_USER: "${DB_USERNAME}"
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      # MYSQL_ALLOW_EMPTY_PASSWORD: 1
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - imtera

  # ===== Frontend (Node/Vite/Nuxt/React) =====
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imtera-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - imtera

  nginx:
    image: nginx:alpine
    container_name: imtera-nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - imtera
networks:
  imtera:
    driver: bridge

volumes:
  mysql_data:
  frontend_node_modules:
