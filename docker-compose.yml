services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imtera-backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/var/www/html
    networks:
      - imtera
    depends_on:
      - mysql

  mysql:
    image: mysql/mysql-server:8.0
    container_name: imtera-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_ROOT_HOST: "%"
      MYSQL_DATABASE: imtera_app
      MYSQL_USER: imtera_app
      MYSQL_PASSWORD: password
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/conf.d:/etc/mysql/conf.d
    networks:
      - imtera

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imtera-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
    depends_on:
      - backend
    networks:
      - imtera

  nginx:
    image: nginx:alpine
    container_name: imtera-nginx
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www/html
      - ./frontend/dist:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - imtera

networks:
  imtera:
    driver: bridge

volumes:
  mysql_data:
  frontend_node_modules:
